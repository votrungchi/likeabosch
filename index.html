<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>likeabosch - Terminal</title>

    <!-- Favicon 🍻 drawn with a lightweight inline SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23282828%22/><text y=%22.9em%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2270%22>🍻</text></svg>">

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <style>
        :root { --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace; }

        /* Catppuccin Mocha */
        [data-theme="dark"] {
            --bg0: #1e1e2e; --bg1: #313244; --bg2: #45475a;
            --fg0: #cdd6f4; --fg1: #bac2de; --fg2: #a6adc8;
            --red: #f38ba8; --green: #a6e3a1; --yellow: #f9e2af;
            --blue: #89b4fa; --purple: #cba6f7; --aqua: #94e2d5;
            --gray: #6c7086; --border: #45475a; --active-border: #a6e3a1;
            /* Handwriter box (respects theme) */
            --writer-bg: #313244; --writer-grid: rgba(243,139,168,0.22);
            --writer-border: #585b70;
            --writer-stroke: #89b4fa; --writer-radical: #f38ba8; --writer-outline: #585b70;
        }

        /* Catppuccin Latte */
        [data-theme="light"] {
            --bg0: #eff1f5; --bg1: #e6e9ef; --bg2: #ccd0da;
            --fg0: #4c4f69; --fg1: #5c5f77; --fg2: #6c6f85;
            --red: #d20f39; --green: #40a02b; --yellow: #df8e1d;
            --blue: #1e66f5; --purple: #8839ef; --aqua: #179299;
            --gray: #8c8fa1; --border: #bcc0cc; --active-border: #40a02b;
            /* Handwriter box (respects theme) */
            --writer-bg: #ffffff; --writer-grid: rgba(210,15,57,0.18);
            --writer-border: #acb0be;
            --writer-stroke: #1e66f5; --writer-radical: #d20f39; --writer-outline: #acb0be;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

        body {
            font-family: var(--font-mono); background-color: var(--bg0); color: var(--fg1);
            line-height: 1.5; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- TMUX STATUS LINE --- */
        .status-bar {
            background-color: var(--bg1); display: flex; justify-content: space-between;
            font-size: 0.85rem; border-bottom: 2px solid var(--green); z-index: 10;
        }
        .status-module { padding: 4px 12px; display: flex; align-items: center; gap: 8px; }
        .module-mode { background-color: var(--green); color: var(--bg0); font-weight: bold; }
        .module-btn { cursor: pointer; transition: background 0.1s; user-select: none; }
        .module-btn:hover { background-color: var(--bg2); }

        /* --- WORKSPACE & PANES --- */
        .workspace { flex: 1; padding: 4px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-bottom: 70px; position: relative; }
        .pane { border: 1px solid var(--border); background-color: var(--bg0); display: flex; flex-direction: column; }
        .pane-header { background-color: var(--bg1); color: var(--fg2); font-size: 0.75rem; padding: 2px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .pane-content { padding: 16px; display: flex; flex-direction: column; align-items: center; height: 100%; }

        /* --- PANES SPECIFICS --- */
        .hanzi-display { font-size: 5rem; font-family: sans-serif; line-height: 1; color: var(--fg0); margin: 0; text-align: center; }
        .hanzi-container { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; margin: 10px 0; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .btn-audio-header { border-color: var(--blue); color: var(--blue); padding: 0 6px; font-size: 0.75rem; line-height: 1.4; }

        .meaning-block { display: none; text-align: center; width: 100%; border-top: 1px dashed var(--border); padding-top: 12px; margin-bottom: 12px; }
        .pinyin { color: var(--yellow); font-size: 1.3rem; font-weight: bold; }
        .pos-badge { color: var(--aqua); font-size: 0.85rem; margin-top: 4px; }

        .p-split { display: flex; flex-direction: row; gap: 4px; flex: 1; }
        @media (max-width: 600px) { .p-split { flex-direction: column; } }

        .p-stroke { flex: 0 0 auto; align-items: center; justify-content: center; }
        @media (min-width: 601px) { .p-stroke { width: 240px; } }

        /* Multi-character stroke container support */
        .stroke-box-wrapper { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; flex: 1; width: 100%; }
        .char-target-item {
            width: 100px; height: 100px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid var(--writer-border); border-radius: 4px;
            background-color: var(--writer-bg);
            background-image:
                linear-gradient(to right, transparent calc(50% - 0.5px), var(--writer-grid) calc(50% - 0.5px), var(--writer-grid) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
                linear-gradient(to bottom, transparent calc(50% - 0.5px), var(--writer-grid) calc(50% - 0.5px), var(--writer-grid) calc(50% + 0.5px), transparent calc(50% + 0.5px));
        }
        @media (min-width: 601px) { .char-target-item { width: 90px; height: 90px; } }

        .p-context { flex: 1; }
        .sentences-container { width: 100%; flex: 1; }
        .sentence-item { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--bg2); width: 100%; }
        .sent-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .sent-hanzi { font-size: 1.2rem; font-family: sans-serif; color: var(--fg0); flex: 1; user-select: text;}
        .sent-details { display: none; border-left: 2px solid var(--gray); padding-left: 12px; margin-top: 8px; }
        .sent-pinyin { color: var(--aqua); font-size: 0.9rem; margin-bottom: 2px; }
        .sent-trans { color: var(--fg1); font-size: 0.95rem; }
        .sentences-container.show-details .sent-details { display: block; }

        /* --- BUTTONS --- */
        .btn {
            background: transparent; border: 1px solid var(--border); color: var(--fg1);
            font-family: var(--font-mono); font-size: 0.85rem; padding: 10px 12px;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            width: 100%; user-select: none; transition: background 0.1s;
        }
        .btn:hover, .btn:active { background: var(--bg2); }

        .sys-btn { background: transparent; border: 1px solid var(--border); color: var(--fg1); font-family: var(--font-mono); cursor: pointer; padding: 2px 8px; font-size: 0.8rem; border-radius: 2px; }
        .sys-btn:hover { background: var(--bg2); }
        .btn-sent-audio { border: 1px solid var(--blue); color: var(--blue); padding: 2px 8px; margin-left: 8px; }
        .kbd { color: var(--gray); font-size: 0.7rem; }

        /* --- ANKI BOTTOM BAR --- */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg0); border-top: 1px solid var(--border);
            padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
            z-index: 100;
        }

        .btn-anki-1 { border-bottom: 3px solid var(--red); }
        .btn-anki-2 { border-bottom: 3px solid var(--purple); }
        .btn-anki-3 { border-bottom: 3px solid var(--green); }
        .btn-anki-4 { border-bottom: 3px solid var(--blue); }
        .btn .interval { color: var(--yellow); font-size: 0.7rem; font-weight: bold; }

        #loading { padding: 20px; color: var(--yellow); }
        .error-msg { color: var(--red); }
    </style>
</head>
<body data-theme="dark">

<div class="status-bar" id="status-bar">
    <div class="status-module module-mode" id="mode-indicator">-- NORMAL --</div>
    <div style="display: flex;">
        <div class="status-module module-btn" id="theme-toggle">[DARK]</div>
        <div class="status-module module-btn" id="lang-toggle">[VI]</div>
    </div>
</div>

<div id="loading">Loading database.json...</div>

<div class="workspace" id="app-content" style="display: none;">
    <!-- NORMAL VIEW -->
    <div class="pane p-main" id="pane-main">
        <div class="pane-header">
            <span>~/likeabosch/main.c</span>
            <span class="header-right">
                <span id="ui-level">level:-</span>
                <button class="sys-btn btn-audio-header" id="btn-audio-main">🔊 [s]</button>
            </span>
        </div>
        <div class="pane-content">
            <div class="hanzi-container">
                <div class="hanzi-display" id="main-hanzi">不</div>
            </div>
            <div class="meaning-block" id="meaning-area">
                <div class="pinyin" id="main-pinyin">bù</div>
                <div id="main-meaning">không</div>
                <div class="pos-badge" id="main-pos">[pos: Phó từ]</div>
            </div>
            <div style="margin-top: auto; font-size: 0.8rem; color: var(--gray);">[Space] Reveal / [h] Prev / [l] Next</div>
        </div>
    </div>

    <div class="p-split">
        <div class="pane p-stroke" id="pane-stroke">
            <div class="pane-header"><span>~/likeabosch/stroke.c</span></div>
            <div class="pane-content">
                <!-- Supports rendering multiple boxes for multi-character words -->
                <div class="stroke-box-wrapper" id="stroke-box-wrapper"></div>
                <div style="margin-top: auto; font-size: 0.8rem; color: var(--gray);">[r] Replay (or click box)</div>
            </div>
        </div>
        <div class="pane p-context" id="pane-context">
            <div class="pane-header"><span>~/likeabosch/context.c</span></div>
            <div class="pane-content" style="align-items: flex-start;">
                <div class="sentences-container" id="sentences-container"></div>
                <div style="margin-top: auto; font-size: 0.8rem; color: var(--gray);">[t] Translate</div>
            </div>
        </div>
    </div>
</div>

<!-- ANKI STYLE BOTTOM BAR -->
<div class="bottom-bar" id="bottom-bar" style="display: none;">
    <button class="btn btn-anki-1" id="btn-again">
        <span class="interval" id="int-again"></span>
        <span class="label">Lại</span> <span class="kbd">[1]</span>
    </button>
    <button class="btn btn-anki-2" id="btn-hard">
        <span class="interval" id="int-hard"></span>
        <span class="label">Khó</span> <span class="kbd">[2]</span>
    </button>
    <button class="btn btn-anki-3" id="btn-good">
        <span class="interval" id="int-good"></span>
        <span class="label">Được</span> <span class="kbd">[3]</span>
    </button>
    <button class="btn btn-anki-4" id="btn-easy">
        <span class="interval" id="int-easy"></span>
        <span class="label">Dễ</span> <span class="kbd">[4]</span>
    </button>
</div>

<script>
    const dict = {
        vi: {
            again: "Lại", hard: "Khó", good: "Được", easy: "Dễ",
            posPrefix: "pos: ", lvlPrefix: "level: "
        },
        en: {
            again: "Again", hard: "Hard", good: "Good", easy: "Easy",
            posPrefix: "pos: ", lvlPrefix: "level: "
        }
    };

    let db = [];
    let curIdx = 0;
    let writers = []; // Array holding one HanziWriter instance per character

    // States
    let sysLang = 'vi';
    let sysTheme = 'dark';
    let ansRevealed = false;
    let transRevealed = false;

    const el = {
        app: document.getElementById('app-content'), load: document.getElementById('loading'),
        bottomBar: document.getElementById('bottom-bar'),

        btnTheme: document.getElementById('theme-toggle'),
        btnLang: document.getElementById('lang-toggle'),

        level: document.getElementById('ui-level'), hanzi: document.getElementById('main-hanzi'),
        pinyin: document.getElementById('main-pinyin'), meaning: document.getElementById('main-meaning'),
        pos: document.getElementById('main-pos'), meanArea: document.getElementById('meaning-area'),
        strokeWrapper: document.getElementById('stroke-box-wrapper'), sentContainer: document.getElementById('sentences-container'),

        paneMain: document.getElementById('pane-main'), paneStroke: document.getElementById('pane-stroke'), paneContext: document.getElementById('pane-context'),
        btnAudioMain: document.getElementById('btn-audio-main'),

        btnAgain: document.getElementById('btn-again'), btnHard: document.getElementById('btn-hard'),
        btnGood: document.getElementById('btn-good'), btnEasy: document.getElementById('btn-easy'),

        intAgain: document.getElementById('int-again'), intHard: document.getElementById('int-hard'),
        intGood: document.getElementById('int-good'), intEasy: document.getElementById('int-easy')
    };

    // --- INIT ---
    async function fetchDatabase() {
        try {
            const res = await fetch('./database.json');

            if(!res.ok) throw new Error("File not found");
            db = await res.json();

            if(db.length === 0) throw new Error("Empty database");

            el.load.style.display = 'none';
            el.app.style.display = 'flex';
            el.bottomBar.style.display = 'grid';
            loadState();
            updateUILocale();
            let start = pickDueIndex(-1);
            if(start === -1) start = 0;
            loadWord(start);
        } catch(e) {
            console.error(e);
            el.load.innerHTML = `<span class="error-msg">[Error] Cannot load database.json</span><br><br>
            Please ensure you have created the <b>database.json</b> file in your repository.<br>
            If you are running this locally (file://), your browser is blocking local file access due to CORS security. <br>
            Please host it on Github Pages or use a local web server (like VS Code Live Server).`;
        }
    }
    fetchDatabase();

    function updateUILocale() {
        const d = dict[sysLang];
        el.btnAgain.querySelector('.label').innerText = d.again;
        el.btnHard.querySelector('.label').innerText = d.hard;
        el.btnGood.querySelector('.label').innerText = d.good;
        el.btnEasy.querySelector('.label').innerText = d.easy;
    }

    // Character-box colors follow the active theme (dark/light).
    function getWriterColors() {
        const s = getComputedStyle(document.body);
        return {
            stroke: s.getPropertyValue('--writer-stroke').trim(),
            radical: s.getPropertyValue('--writer-radical').trim(),
            outline: s.getPropertyValue('--writer-outline').trim()
        };
    }

    function updateWriterTheme() {
        const c = getWriterColors();
        writers.forEach(w => {
            if(w) {
                w.updateColor('strokeColor', c.stroke);
                w.updateColor('radicalColor', c.radical);
                w.updateColor('outlineColor', c.outline);
                w.updateColor('drawingColor', c.radical);
            }
        });
    }

    // --- RENDER ---
    function renderWord() {
        const w = db[curIdx];
        if(!w) return;
        el.level.innerText = `${dict[sysLang].lvlPrefix}${w.level || '-'}`;
        el.hanzi.innerText = w.hanzi;
        el.pinyin.innerText = w.pinyin;

        el.meaning.innerText = sysLang === 'vi' ? (w.mean_vi || '') : (w.mean_en || '');
        el.pos.innerText = `[pos: ${sysLang === 'vi' ? w.pos_vi : w.pos_en}]`;

        let html = '';
        if(w.sentences) {
            w.sentences.forEach(s => {
                const trans = sysLang === 'vi' ? s.vi : s.en;
                html += `
                <div class="sentence-item">
                    <div class="sent-header-row">
                        <div class="sent-hanzi">${s.hanzi}</div>
                        <button class="sys-btn btn-sent-audio" style="border-color: var(--aqua); color: var(--aqua);" data-text="${s.hanzi}">🔊</button>
                    </div>
                    <div class="sent-details">
                        <div class="sent-pinyin">${s.pinyin}</div>
                        <div class="sent-trans">${trans}</div>
                    </div>
                </div>`;
            });
        }
        el.sentContainer.innerHTML = html;
        el.sentContainer.className = transRevealed ? "sentences-container show-details" : "sentences-container";

        document.querySelectorAll('.btn-sent-audio').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                speak(btn.getAttribute('data-text'));
            });
        });
    }

    function loadWord(idx) {
        if(db.length === 0) return;
        curIdx = idx;
        ansRevealed = false; transRevealed = false;
        el.meanArea.style.display = 'none';
        renderWord();

        // Create one stroke box per character for multi-character words (e.g. 教学楼)
        el.strokeWrapper.innerHTML = '';
        writers = [];
        const hanziStr = db[idx].hanzi;

        // Split into individual Han characters (ignore any stray symbols)
        const chars = hanziStr.split('');
        const wc = getWriterColors();
        chars.forEach((char, i) => {
            const boxId = `char-target-${i}`;
            const boxDiv = document.createElement('div');
            boxDiv.className = 'char-target-item';
            boxDiv.id = boxId;
            el.strokeWrapper.appendChild(boxDiv);

            // Initialize a hanzi writer for each character
            const writerInstance = HanziWriter.create(boxId, char, {
                width: 85, height: 85, padding: 5, strokeAnimationSpeed: 1.2, delayBetweenStrokes: 50,
                showOutline: true, strokeColor: wc.stroke, radicalColor: wc.radical,
                outlineColor: wc.outline, drawingColor: wc.radical
            });
            writers.push(writerInstance);

            // Clicking a character box replays that character's animation
            boxDiv.addEventListener('click', () => {
                writerInstance.animateCharacter();
            });
        });

        updateButtonHints();
    }

// --- UTILS: TEXT-TO-SPEECH (iOS Safari safe) ---
    const hasSpeech = 'speechSynthesis' in window;
    let zhVoice = null;
    let speechUnlocked = false;

    function pickVoice() {
        if(!hasSpeech) return;
        const voices = window.speechSynthesis.getVoices() || [];
        const zh = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
        if(zh.length === 0) { zhVoice = null; return; }

        // Prefer Mandarin (zh-CN) over other Chinese variants.
        const mandarin = zh.filter(v => v.lang.toLowerCase() === 'zh-cn');
        const pool = mandarin.length ? mandarin : zh;

        // Known high-quality female Mandarin voices across platforms
        // (iOS/macOS: Tingting; Google: Chinese female; MS: Xiaoxiao/Xiaoyi/Huihui/Yaoyao).
        const FEMALE = [
            'xiaoxiao', 'xiaoyi', 'huihui', 'yaoyao', 'tingting', 'ting-ting',
            'sinji', 'meijia', 'google 普通话', 'female', '女'
        ];
        const MALE = ['kangkang', 'yunyang', 'yunxi', 'liang', 'male', '男'];

        const byName = (list) => pool.find(v => {
            const n = (v.name || '').toLowerCase();
            return list.some(k => n.includes(k));
        });

        zhVoice = byName(FEMALE)                              // best: named female voice
               || pool.find(v => !MALE.some(k => (v.name || '').toLowerCase().includes(k))) // avoid known male
               || pool[0]                                     // any Mandarin
               || null;
    }

    if(hasSpeech) {
        pickVoice();
        // iOS/Chrome load voices asynchronously
        window.speechSynthesis.onvoiceschanged = pickVoice;
    }

    // iOS requires the first utterance to be triggered inside a user gesture.
    // We "warm up" the synthesizer on the very first tap so later calls work.
    function unlockSpeech() {
        if(speechUnlocked || !hasSpeech) return;
        try {
            const warm = new SpeechSynthesisUtterance('');
            warm.volume = 0;
            window.speechSynthesis.speak(warm);
            speechUnlocked = true;
            pickVoice();
        } catch(e) { /* ignore */ }
    }
    document.addEventListener('touchend', unlockSpeech, { once: true, passive: true });
    document.addEventListener('click', unlockSpeech, { once: true });

    function speak(text) {
        if(!hasSpeech || !text) return;
        // Must run synchronously within a user gesture on iOS.
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        if(zhVoice) utterance.voice = zhVoice;
        window.speechSynthesis.speak(utterance);
    }

    // --- SPACED REPETITION (Anki SM-2 style) ---
    const SRS_KEY = 'likeabosch_srs_v1';
    const MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;
    const LEARN_STEPS = [1, 10];   // minutes for learning steps
    const GRAD_INTERVAL = 1;       // days when graduating with "Good"
    const EASY_INTERVAL = 4;       // days when graduating with "Easy"
    const MIN_EASE = 1.3, EASY_BONUS = 1.3, HARD_MULT = 1.2;
    let cards = {};                // id -> scheduling state

    function loadState() {
        try { cards = JSON.parse(localStorage.getItem(SRS_KEY)) || {}; }
        catch(e) { cards = {}; }
    }
    function saveState() {
        try { localStorage.setItem(SRS_KEY, JSON.stringify(cards)); } catch(e) {}
    }
    function getCard(id) {
        if(!cards[id]) {
            cards[id] = { id, state: 'new', step: 0, ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0 };
        }
        return cards[id];
    }

    function graduate(c, now, days) {
        c.state = 'review';
        c.interval = days;
        c.reps += 1;
        c.step = 0;
        c.due = now + days * DAY;
    }

    function applyLearning(c, rating, now) {
        if(c.state === 'new') c.state = 'learning';
        switch(rating) {
            case 'again':
                c.step = 0;
                c.due = now + LEARN_STEPS[0] * MIN;
                break;
            case 'hard':
                c.due = now + LEARN_STEPS[Math.min(c.step, LEARN_STEPS.length - 1)] * MIN;
                break;
            case 'good':
                c.step += 1;
                if(c.step >= LEARN_STEPS.length) graduate(c, now, GRAD_INTERVAL);
                else c.due = now + LEARN_STEPS[c.step] * MIN;
                break;
            case 'easy':
                graduate(c, now, EASY_INTERVAL);
                break;
        }
    }

    function applyReview(c, rating, now) {
        switch(rating) {
            case 'again':
                c.lapses += 1;
                c.ease = Math.max(MIN_EASE, c.ease - 0.20);
                c.state = 'learning';
                c.step = 0;
                c.interval = 0;
                c.due = now + LEARN_STEPS[0] * MIN;
                break;
            case 'hard':
                c.ease = Math.max(MIN_EASE, c.ease - 0.15);
                c.interval = Math.max(c.interval + 1, Math.round(c.interval * HARD_MULT));
                c.reps += 1;
                c.due = now + c.interval * DAY;
                break;
            case 'good':
                c.interval = Math.max(c.interval + 1, Math.round(c.interval * c.ease));
                c.reps += 1;
                c.due = now + c.interval * DAY;
                break;
            case 'easy':
                c.ease += 0.15;
                c.interval = Math.max(c.interval + 1, Math.round(c.interval * c.ease * EASY_BONUS));
                c.reps += 1;
                c.due = now + c.interval * DAY;
                break;
        }
    }

    function applyRating(c, rating, now) {
        if(c.state === 'new' || c.state === 'learning') applyLearning(c, rating, now);
        else applyReview(c, rating, now);
    }

    // Compute the resulting delay for a rating without mutating the real card.
    function previewDelta(c, rating) {
        const copy = JSON.parse(JSON.stringify(c));
        const now = Date.now();
        applyRating(copy, rating, now);
        return copy.due - now;
    }

    function formatInterval(ms) {
        if(ms < MIN) return '<1m';
        if(ms < HOUR) return Math.round(ms / MIN) + 'm';
        if(ms < DAY) return Math.round(ms / HOUR) + 'h';
        if(ms < 30 * DAY) return Math.round(ms / DAY) + 'd';
        if(ms < 365 * DAY) return Math.round(ms / (30 * DAY)) + 'mo';
        return (ms / (365 * DAY)).toFixed(1) + 'y';
    }

    function updateButtonHints() {
        if(db.length === 0) return;
        const c = getCard(db[curIdx].id);
        el.intAgain.innerText = formatInterval(previewDelta(c, 'again'));
        el.intHard.innerText  = formatInterval(previewDelta(c, 'hard'));
        el.intGood.innerText  = formatInterval(previewDelta(c, 'good'));
        el.intEasy.innerText  = formatInterval(previewDelta(c, 'easy'));
    }

    // Pick the card whose due time is earliest (Anki-style queue).
    function pickDueIndex(excludeIdx) {
        let bestIdx = -1, bestDue = Infinity;
        for(let i = 0; i < db.length; i++) {
            if(i === excludeIdx) continue;
            const due = getCard(db[i].id).due || 0;
            if(due < bestDue) { bestDue = due; bestIdx = i; }
        }
        return bestIdx;
    }

    function processAnswer(rating) {
        if(db.length === 0) return;
        const c = getCard(db[curIdx].id);
        applyRating(c, rating, Date.now());
        saveState();
        let next = pickDueIndex(curIdx);
        if(next === -1) next = curIdx;
        curIdx = next;
        loadWord(curIdx);
    }

    function toggleAnswer() {
        ansRevealed = !ansRevealed;
        el.meanArea.style.display = ansRevealed ? 'block' : 'none';
    }

    function toggleTrans() {
        transRevealed = !transRevealed;
        el.sentContainer.className = transRevealed ? "sentences-container show-details" : "sentences-container";
    }

    // Replay all characters in the word when pressing 'r' or clicking the stroke pane
    function replayAllStrokes() {
        writers.forEach(w => {
            if(w) w.animateCharacter();
        });
    }

    // --- LISTENERS ---
    el.paneMain.addEventListener('click', toggleAnswer);
    el.paneContext.addEventListener('click', toggleTrans);
    el.paneStroke.addEventListener('click', replayAllStrokes); // Click anywhere in the stroke pane to replay

    el.btnAudioMain.addEventListener('click', (e) => {
        e.stopPropagation();
        if(db.length > 0) speak(db[curIdx].hanzi);
    });

    // Anki Buttons Listeners
    el.btnAgain.addEventListener('click', () => processAnswer('again'));
    el.btnHard.addEventListener('click', () => processAnswer('hard'));
    el.btnGood.addEventListener('click', () => processAnswer('good'));
    el.btnEasy.addEventListener('click', () => processAnswer('easy'));

    // Toggle Theme
    el.btnTheme.addEventListener('click', () => {
        sysTheme = sysTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', sysTheme);
        el.btnTheme.innerText = `[${sysTheme.toUpperCase()}]`;
        updateWriterTheme();
    });

    // Toggle Language
    el.btnLang.addEventListener('click', () => {
        sysLang = sysLang === 'vi' ? 'en' : 'vi';
        el.btnLang.innerText = `[${sysLang.toUpperCase()}]`;
        updateUILocale();
        renderWord();
    });

    // --- KEYBOARD BINDINGS (VIM STYLE) ---
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        // NORMAL MODE
        switch(e.key.toLowerCase()) {
            case ' ': e.preventDefault(); toggleAnswer(); break;
            case 't': toggleTrans(); break;
            case 'h': if(db.length > 0) { curIdx = (curIdx - 1 + db.length) % db.length; loadWord(curIdx); } break;
            case 'l': if(db.length > 0) { curIdx = (curIdx + 1) % db.length; loadWord(curIdx); } break;
            case 'r': replayAllStrokes(); break;
            case 's': if(db.length > 0) speak(db[curIdx].hanzi); break;
            case '1': processAnswer('again'); break;
            case '2': processAnswer('hard'); break;
            case '3': processAnswer('good'); break;
            case '4': processAnswer('easy'); break;
        }
    });

    // --- MOBILE SWIPE GESTURES ---
    let touchstartX = 0; let touchendX = 0; let touchstartY = 0; let touchendY = 0;
    document.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX; touchstartY = e.changedTouches[0].screenY;
    }, {passive: true});
    document.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX; touchendY = e.changedTouches[0].screenY;
        handleSwipe();
    }, {passive: true});

    function handleSwipe() {
        const xDiff = touchendX - touchstartX; const yDiff = touchendY - touchstartY;
        if (Math.abs(xDiff) > Math.abs(yDiff) && Math.abs(xDiff) > 60) {
            if (xDiff < 0) processAnswer('again'); // Swipe left
            else processAnswer('good');            // Swipe right
        }
    }

</script>
</body>
